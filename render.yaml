# Render Blueprint: Dashboard -> New -> Blueprint -> pick this repo.
services:
  - type: web
    name: mini-rayyan-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    autoDeployTrigger: checksPass # waits for GitHub CI to go green
    buildFilter:
      paths: ["backend/**"]
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: mini-rayyan-db, property: connectionString }
      - key: JWT_SECRET
        generateValue: true
      - key: NCBI_EMAIL
        sync: false
      - key: SEED_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: CORS_ORIGIN_REGEX
        sync: false

databases:
  - name: mini-rayyan-db
    plan: free
    databaseName: minirayyan
    user: minirayyan
