name: Keep API awake

# Render's free plan sleeps after 15 minutes idle; ping every 10.
# ponytail: GitHub may delay scheduled runs at busy times, so an occasional cold start can still happen
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 https://mini-rayyan-api.onrender.com/health
