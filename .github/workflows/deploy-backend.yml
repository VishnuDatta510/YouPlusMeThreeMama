name: Deploy backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
      - ".github/workflows/ci.yml"

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  # ponytail: CI also runs from its own push trigger, so backend pushes to main run it twice; fine at this size
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_SERVICE: ${{ secrets.RAILWAY_SERVICE || vars.RAILWAY_SERVICE }}
    steps:
      - uses: actions/checkout@v4
      - run: npm install -g @railway/cli@5.71.0
      # Uploads the repo; the Railway service's Root Directory (backend) picks the Dockerfile.
      # Migrations + seed run on container start (see backend/Dockerfile).
      - run: railway up --ci --service "$RAILWAY_SERVICE"
